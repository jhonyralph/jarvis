<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<!-- Sem meta CSP de propósito: esta página é LOCAL (carregada por loadFile do bundle) e não busca
     um único recurso remoto. Num documento file:// a origem é opaca, então `script-src 'self'` não
     casa e bloquearia o setup.js — deixando exatamente a tela de recuperação sem botão nenhum. A
     contenção real aqui é do Electron: sandbox + contextIsolation, e a única superfície privilegiada
     é a ponte auditada window.jarvis. A CSP restritiva continua valendo para a UI do Hub, que é
     conteúdo remoto (ver apps/hub/web/index.html). -->
<title>Jarvis — endereço do Hub</title>
<style>
  :root { color-scheme: dark }
  body { margin:0; background:#0b0b0d; color:#e6e6e6; font:15px/1.6 system-ui,"Segoe UI",sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh }
  .c { max-width:680px; padding:32px; width:100% }
  h1 { font-size:20px; margin:0 0 6px }
  .sub { color:#9aa4b2; font-size:13.5px; margin:0 0 20px }
  .e { color:#ff9b9b; font-size:13.5px; margin:0 0 18px }
  label { display:block; font-size:12.5px; color:#9aa4b2; margin:0 0 6px }
  input { width:100%; box-sizing:border-box; background:#131a22; border:1px solid #2a3542; color:#e8eef5;
          border-radius:8px; padding:11px 12px; font:14px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace }
  input:focus { outline:none; border-color:#1f6feb }
  .row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap }
  button { background:#1f6feb; border:1px solid #1f6feb; color:#fff; border-radius:8px; padding:9px 16px;
           font:600 13.5px system-ui,"Segoe UI",sans-serif; cursor:pointer }
  button.ghost { background:transparent; border-color:#2a3542; color:#c6d2e0; font-weight:500 }
  button:disabled { opacity:.5; cursor:default }
  .msg { margin-top:14px; font-size:13.5px; min-height:20px }
  .ok { color:#4ec97a } .bad { color:#ff9b9b } .mut { color:#8a94a3 }
  .cands { margin-top:24px; border-top:1px solid #1e242c; padding-top:14px }
  .cands h2 { font-size:12.5px; color:#9aa4b2; font-weight:600; margin:0 0 8px; text-transform:uppercase; letter-spacing:.04em }
  .cand { display:flex; gap:8px; align-items:baseline; font-size:13px; padding:3px 0 }
  .cand .src { color:#8a94a3; min-width:210px }
  .cand .val { font-family:ui-monospace,Consolas,monospace; word-break:break-all; color:#c6d2e0 }
  .badge { font-size:11px; padding:1px 7px; border-radius:999px; background:#1f6feb33; border:1px solid #1f6feb; color:#cfe3ff }
  .badge.warn { background:#f8514922; border-color:#f85149; color:#ffc9c9 }
</style>
</head>
<body>
<div class="c">
  <h1>Endereço do Hub</h1>
  <p class="sub">Este app é só a janela: quem guarda tudo é o Hub. Aponte para a máquina onde ele roda.</p>
  <p class="e" id="err" hidden></p>

  <label for="url">Endereço (ex.: <code>https://meu-hub.ts.net</code> ou <code>192.168.0.10:4577</code>)</label>
  <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="https://meu-hub.ts.net" />
  <div class="row">
    <button id="save">Salvar e conectar</button>
    <button id="test" class="ghost">Testar conexão</button>
    <button id="clear" class="ghost">Usar o padrão do sistema</button>
    <button id="retry" class="ghost">Tentar de novo</button>
  </div>
  <div class="msg" id="msg"></div>

  <div class="cands">
    <h2>Endereços que encontrei nesta máquina</h2>
    <div id="cands" class="mut" style="font-size:13px">—</div>
  </div>
</div>
<script src="setup.js"></script>
</body>
</html>
