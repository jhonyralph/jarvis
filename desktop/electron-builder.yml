# Packaging + auto-update for the Jarvis desktop shell.
# Reference only in Phase 0 — signing/notarization are the operator's build step (see README).
appId: chat.jarvis.desktop
productName: Jarvis
copyright: Jonathan Campos

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - src/**/*
  - package.json

# Auto-update source. GitHub Releases by default (electron-updater reads this).
# Swap `owner`/`repo` or use a `generic` provider (self-hosted URL) to keep it private.
publish:
  provider: github
  owner: jhonyralph
  repo: jarvis
  # O semantic-release JÁ cria a Release publicada; o default do electron-builder é `draft` e ele
  # então recusa anexar ("existing type not compatible with publishing type") — pulando os
  # instaladores em silêncio, com exit 0. `release` faz ele subir os assets na release existente.
  releaseType: release

mac:
  target: [dmg, zip] # zip is required for electron-updater on macOS
  category: public.app-category.developer-tools
  # Arrastar para /Applications já faz o Spotlight indexar: "⌘+espaço → jarvis" acha o app.
  #
  # ARQUITETURA: fixada pelos flags `--x64 --arm64` do job mac em release-desktop.yml, NÃO aqui.
  # Não existe chave `arch` no bloco `mac` (o electron-builder 25 aborta com "unknown property");
  # a forma de fixar na config seria trocar o `target` acima por objetos —
  # `target: [{target: dmg, arch: [x64, arm64]}, {target: zip, arch: [x64, arm64]}]` — e essa forma
  # VENCE os flags da CLI (targetFactory: `target.arch` tem precedência). É justamente por isso que
  # ela não está aqui: faria TODO build local (`npm run dist`, `./scripts/install-desktop.sh
  # --build`) baixar dois binários do Electron e empacotar duas vezes. O CI publica as duas; a
  # máquina de quem desenvolve empacota só a dela. Contra esquecer o flag no CI existe um passo que
  # falha antes do build.
  #
  # Piso de macOS, até aqui não declarado em lugar nenhum do projeto. O Electron 34
  # (desktop/package.json) exige macOS 11 Big Sur ou mais novo — o Chromium que ele embarca largou
  # o Catalina a partir do Electron 33. Isto escreve LSMinimumSystemVersion no Info.plist do app:
  # num Mac abaixo de 11.0 o macOS recusa ABRIR com uma mensagem explícita ("requer macOS 11 ou
  # posterior") em vez de o app quebrar no launch. O DMG em si não valida versão — a instalação
  # (arrastar para Applications) continua acontecendo.
  minimumSystemVersion: "11.0"
  #
  # Sem artifactName, o x64 sai SEM marca de arquitetura (`Jarvis-0.37.2.dmg`) ao lado do
  # `Jarvis-0.37.2-arm64.dmg` — e quem baixa tem de adivinhar qual é o seu. Com ${arch} os dois se
  # identificam. O sufixo também é o que o electron-updater usa para escolher: ele filtra os assets
  # pela substring "arm64" NO NOME DO ARQUIVO. O filtro não é simétrico: num Mac Intel os arm64 são
  # descartados (e sem build x64 sobra lista vazia, que é um erro), mas num Mac ARM sem arquivo
  # arm64 ele FICA com o x64 e o instala sob Rosetta de propósito, sem avisar.
  artifactName: ${productName}-${version}-${arch}.${ext}

win:
  target: [nsis]
nsis:
  # Atalho no Menu Iniciar é o que faz "tecla Windows → jarvis" encontrar o app. É o default do
  # electron-builder, mas explicitado porque é requisito, não detalhe de implementação.
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Jarvis
  # Instalação por usuário: não pede UAC/admin, que é o esperado para um cliente de desktop.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  # AppImage é portátil, mas NÃO se registra no menu de aplicativos sozinho — baixar e rodar não faz
  # o app aparecer na busca do sistema (só com AppImageLauncher instalado). O `deb` instala de
  # verdade e cria a entrada .desktop, então quem usa Debian/Ubuntu acha o Jarvis na busca como nos
  # outros SOs. Os dois alvos são publicados: AppImage para quem quer portátil, deb para integrar.
  target: [AppImage, deb]
  category: Development
  synopsis: Voice-first control plane for coding agents
  desktop:
    # `Keywords` alimenta a busca do GNOME/KDE — digitar "agent" ou "claude" também encontra.
    Name: Jarvis
    Keywords: jarvis;ai;agent;claude;codex;assistant;
    StartupWMClass: Jarvis
