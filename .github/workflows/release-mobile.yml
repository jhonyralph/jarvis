name: Release mobile

# Builds the mobile shell (mobile/) as a GENERIC, server-agnostic app — no Hub URL is baked (see
# capacitor.config.ts); the user enters their own Hub address in-app on first launch.
#
#   • Android → sideload APK, attached to the GitHub Release.
#   • iOS     → signed .ipa uploaded to TestFlight. GATED OFF until the repo variable ENABLE_IOS_BUILD=true
#               and the Apple secrets exist (docs/mobile.md → "iOS / Apple").
#
# Who runs it:
#   • release.yml calls it after every published release (workflow_call, with the new tag in `ref`).
#   • Actions → "Release mobile" → Run workflow (tick `publish` to attach/upload; `force` ignores the gate).
#
# The app is a WEBVIEW shell, so each platform only builds when the fingerprint of what ends up IN the
# app (scripts/mobile-app-hash.mjs) differs from the one saved beside the last release that shipped
# THAT platform. Android and iOS keep separate baselines, so turning iOS on later is not blocked by an
# Android build that already published the same fingerprint.
#
# The Android artifact is the SIDELOAD DEBUG apk (debug-signed, installable via "unknown sources") — no
# release keystore required. To ship a store/signed build, add a keystore and switch to
# `assembleSideloadRelease` / the `aab` task (see mobile/BUILD.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the APK to / upload the iOS build for the latest GitHub Release"
        type: boolean
        default: false
      force:
        description: "Build even if the app fingerprint is unchanged (skip the 'needs build?' gate)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

permissions:
  contents: write

jobs:
  # Gate — see the header. A release with an unchanged fingerprint simply carries no mobile asset; the
  # previous one is still current because the shell loads the live UI from the Hub.
  decide:
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.fp.outputs.hash }}
      android_needed: ${{ steps.fp.outputs.android_needed }}
      ios_needed: ${{ steps.fp.outputs.ios_needed }}
      publish: ${{ steps.fp.outputs.publish }}
      tag: ${{ steps.fp.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: fp
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ inputs.ref }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          FORCE: ${{ inputs.force }}
          IOS_ENABLED: ${{ vars.ENABLE_IOS_BUILD }}
        run: |
          HASH="$(node -e "import('./scripts/mobile-app-hash.mjs').then((m) => console.log(m.computeAppFingerprint().hash))")"

          # Fingerprint saved by the most recent release that shipped this platform ('' = never shipped).
          baseline() {
            for T in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 30 --json tagName --jq '.[].tagName'); do
              rm -rf _prev
              if gh release download "$T" --repo "$GITHUB_REPOSITORY" --pattern "$1" --dir _prev >/dev/null 2>&1 && [ -f "_prev/$1" ]; then
                tr -d '[:space:]' < "_prev/$1"
                return 0
              fi
            done
            return 0
          }
          needed() {
            if [ "$FORCE" = "true" ]; then echo true; elif [ -z "$1" ]; then echo true; elif [ "$1" != "$HASH" ]; then echo true; else echo false; fi
          }

          ANDROID_BASE="$(baseline mobile-app-hash.txt)"
          IOS_BASE="$(baseline mobile-app-hash-ios.txt)"
          ANDROID_NEEDED="$(needed "$ANDROID_BASE")"
          IOS_NEEDED=false
          [ "$IOS_ENABLED" = "true" ] && IOS_NEEDED="$(needed "$IOS_BASE")"

          # Called by release.yml (REF set) or dispatched with `publish` → attach to a Release.
          PUBLISH=false
          if [ -n "$REF" ] || [ "$PUBLISH_INPUT" = "true" ]; then PUBLISH=true; fi
          TAG="$REF"
          if [ "$PUBLISH" = "true" ] && [ -z "$TAG" ]; then TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"; fi

          {
            echo "hash=$HASH"
            echo "android_needed=$ANDROID_NEEDED"
            echo "ios_needed=$IOS_NEEDED"
            echo "publish=$PUBLISH"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Mobile build gate"
            echo "- fingerprint: \`$HASH\`"
            echo "- Android: baseline \`${ANDROID_BASE:-none}\` → build **$ANDROID_NEEDED**"
            echo "- iOS: enabled=\`${IOS_ENABLED:-false}\`, baseline \`${IOS_BASE:-none}\` → build **$IOS_NEEDED**"
            echo "- publish: $PUBLISH (release: \`${TAG:-n/a}\`)"
          } >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: decide
    if: ${{ needs.decide.outputs.android_needed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21 # Jarvis native plugins target JVM 21 (mobile/BUILD.md)
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Root deps (the build script + Capacitor CLI resolve from here); then the mobile package.
      - run: npm ci
      - name: Install mobile deps
        working-directory: mobile
        run: npm install
      - name: Add the Android platform (generated dir, not committed)
        working-directory: mobile
        run: npx cap add android || echo "android platform already present"

      # GENERIC build: JARVIS_APP_HUB_URL is intentionally UNSET → no URL baked → the in-app launcher asks
      # the user for their Hub. build-mobile.mjs runs sync-web + cap sync + Gradle assembleSideloadDebug.
      - name: Build APK (server-agnostic, unsigned/sideload)
        run: node scripts/build-mobile.mjs android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-apk
          path: mobile/android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk
          if-no-files-found: error

      - name: Attach APK to the Release
        if: ${{ needs.decide.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.decide.outputs.tag }}
          HASH: ${{ needs.decide.outputs.hash }}
        run: |
          cp mobile/android/app/build/outputs/apk/sideload/debug/app-sideload-debug.apk "Jarvis-${TAG}-android.apk"
          gh release upload "$TAG" "Jarvis-${TAG}-android.apk" --clobber
          # Save the fingerprint of THIS app as the baseline the next run's gate compares against.
          printf '%s' "$HASH" > mobile-app-hash.txt
          gh release upload "$TAG" mobile-app-hash.txt --clobber

  # iOS → TestFlight. Needs an Apple Developer account; see docs/mobile.md "iOS / Apple" for the exact
  # secrets. Enabled by the repository VARIABLE ENABLE_IOS_BUILD=true (anything else = job skipped).
  ios:
    needs: decide
    if: ${{ needs.decide.outputs.ios_needed == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Import signing certificate and provisioning profile
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${CERT_P12_BASE64:?secret APPLE_CERT_P12_BASE64 is missing}"
          : "${CERT_PASSWORD:?secret APPLE_CERT_PASSWORD is missing}"
          : "${PROFILE_BASE64:?secret APPLE_PROVISIONING_PROFILE_BASE64 is missing}"
          : "${APPLE_TEAM_ID:?secret APPLE_TEAM_ID is missing}"

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this codesign blocks on a keychain-access prompt that nobody can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_TEAM="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          if [ "$PROFILE_TEAM" != "$APPLE_TEAM_ID" ]; then
            echo "::error::the provisioning profile belongs to team $PROFILE_TEAM but APPLE_TEAM_ID is $APPLE_TEAM_ID"
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "APPLE_PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - run: npm ci
      - name: Install mobile deps
        working-directory: mobile
        run: npm install

      # Generic build (no baked URL). Marketing version = the release version; build number = UTC
      # timestamp, which only ever grows (App Store Connect rejects a repeated build number).
      - name: Archive and export the .ipa (server-agnostic)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          export JARVIS_IOS_VERSION="${VERSION%%-*}"
          export JARVIS_IOS_BUILD="$(date -u +%y%m%d%H%M)"
          node scripts/build-mobile.mjs apple --cocoapods --export

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ios-ipa
          path: mobile/build/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ needs.decide.outputs.publish == 'true' }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          : "${ASC_KEY_ID:?secret ASC_KEY_ID is missing}"
          : "${ASC_ISSUER_ID:?secret ASC_ISSUER_ID is missing}"
          : "${ASC_KEY_P8_BASE64:?secret ASC_KEY_P8_BASE64 is missing}"
          # altool looks the key up by id in this directory.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_FILE"
          IPA="$(ls mobile/build/ipa/*.ipa | head -1)"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f "$KEY_FILE"

      - name: Save the iOS baseline on the Release
        if: ${{ needs.decide.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.decide.outputs.tag }}
          HASH: ${{ needs.decide.outputs.hash }}
        run: |
          printf '%s' "$HASH" > mobile-app-hash-ios.txt
          gh release upload "$TAG" mobile-app-hash-ios.txt --clobber
